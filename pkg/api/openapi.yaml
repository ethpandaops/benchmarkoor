          format: int64
          description: Unix timestamp of when the index was generated
        entries:
          type: array
          items:
            $ref: "#/components/schemas/IndexEntry"

    IndexEntry:
      type: object
      properties:
        discovery_path:
          type: string
        run_id:
          type: string
        timestamp:
          type: integer
          format: int64
        timestamp_end:
          type: integer
          format: int64
        suite_hash:
          type: string
        status:
          type: string
        termination_reason:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Run metadata labels (key-value pairs)
        deletion_requested_at:
          type: integer
          format: int64
          description: |
            Unix timestamp (seconds) of when the run was queued for deletion.
