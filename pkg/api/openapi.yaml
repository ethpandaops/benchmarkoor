    post:
      operationId: upsertUserMapping
      tags: [admin]
      summary: Create or update a user role mapping
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserMappingRequest"
      responses:
        "200":
          description: Mapping created or updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMapping"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/github/user-mappings/{id}:
    delete:
      operationId: deleteUserMapping
      tags: [admin]
      summary: Delete a user role mapping
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Mapping deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOk"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Mapping not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/indexer/run:
    post:
      operationId: runIndexer
      tags: [admin]
      summary: Trigger an immediate indexing pass
      description: Starts an indexing pass. Returns 409 if one is already in progress.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "202":
          description: Indexing started
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: started
                  message:
                    type: string
                    example: Indexing pass started
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Indexing already in progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: already_running
                  message:
                    type: string
                    example: Indexing pass already in progress

  /admin/indexer/stats:
    get:
      operationId: getIndexerStats
      tags: [admin]
      summary: Recent indexing passes
      description: |
        Reports the most recent indexing passes, newest first: how long each
        one took and what it did. It is what shows a pass getting slower
        before it gets slow enough to notice.

        The indexer writes a row when a pass ends and keeps the last few
        hundred, so `limit` above that returns everything there is. A pass
        with status `cancelled` was cut short by a shutdown, either between
        two discovery paths or inside one, so its counters describe only the
        work it got through.

        A pass in flight has no row yet: it is reported by `running` and
        `current_pass`, which carries when it started and how long it has
        been going.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          description: How many passes to return. Default 100, maximum 500.
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Pass history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexerStatsResponse"
        "400":
          description: Indexing is not enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/database:
    get:
      operationId: getDatabaseStats
      tags: [admin]
      summary: Index database size and contents
      description: |
        Reports how large the index database is, what is in it, and how much
        room is left on its volume, so an admin can tell whether a cleanup is
        due before the disk fills.

        Gathering the report counts every row in every table, so it is cached
        for five minutes and only one gather runs at a time. `gathered_at`
        says when the figures were taken.

        Per-table byte sizes are not reported: this build of SQLite has no
        `dbstat` virtual table. `free_pages * page_size` is what a VACUUM
        would hand back, but a VACUUM needs as much free space again as the
        database occupies.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Database report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseStatsResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/indexer/failures:
    get:
      operationId: listIndexerFailures
      tags: [admin]
      summary: List runs the indexer could not index
      description: |
        Returns runs that storage exposes but the indexer cannot index,
        usually because the run directory never got its `config.json`.

        A run is only recorded once it is older than the indexer's failure
        grace period, so a run still uploading never appears here. A recorded
        run is skipped by later passes until the retry interval lapses, and
        its record disappears on its own if the run later indexes or leaves
        storage.

        Newest run first. A neglected deployment holds thousands of these, so
        the listing is paged.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 200
            minimum: 1
            maximum: 1000
          description: Page size. Out-of-range values are clamped.
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: Recorded index failures
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexerFailuresResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/indexer/failures/delete:
    post:
      operationId: deleteIndexerFailures
      tags: [admin]
      summary: Queue failed runs so their stored data is deleted
      description: |
        Queues the stored data of failed runs for deletion. The request
        returns as soon as every record is marked; a background worker does
        the storage deletes in queue order and drops each record once its
        data is gone.

        Pass either `run_ids` or `all`. A run whose delete fails keeps its
        place in the queue with the reason on its record, and is retried.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndexerFailuresActionRequest"
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  queued:
                    type: integer
                  errors:
                    type: array
                    items:
                      type: string
        "400":
          description: Neither run_ids nor all was given
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Storage backend does not support deletion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/indexer/failures/delete/cancel:
    post:
      operationId: cancelDeleteIndexerFailures
      tags: [admin]
      summary: Take failed runs out of the deletion queue
      description: |
        Best-effort: a record the worker is deleting at this moment is still
        removed from the queue. A record that is not queued counts as
        cancelled. Pass either `run_ids` or `all`.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndexerFailuresActionRequest"
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  cancelled:
                    type: integer
                  errors:
                    type: array
                    items:
                      type: string
        "400":
          description: Neither run_ids nor all was given
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/runs/delete:
    post:
      operationId: deleteRuns
      tags: [admin]
      summary: Queue runs for deletion
      description: |
        Queues one or more runs for deletion. The request returns as soon as every
        run is marked. A background worker then deletes the runs one at a time, in
        the order they were queued: first from storage (S3/local), then from all
        related index tables (test_stats, block_logs, runs).

        While a run sits in the queue it stays visible in `GET /index` with
        `deletion_requested_at` set. A run that fails to delete keeps its place in
        the queue, carries the error in `deletion_error`, and is retried. The queue
        is persisted in the index database, so it survives a restart.

        Queuing a run that is already queued is a no-op. A run whose status is
        `running` is refused, because deleting it would race with the active
        runner. Partial success is possible — the response includes a count of
        queued runs and any per-run errors.

        `suite_hashes` queues every run of the named suites, at most 200 per
        request. A suite can hold thousands of runs, so the server resolves
        them rather than making the client send every ID. Runs of that suite
        which are still running, and runs that were already queued, are both
        reported in `errors`, so a repeat request explains why it queued
        nothing. Give `run_ids`, `suite_hashes`, or both.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Give run_ids, suite_hashes, or both.
              properties:
                run_ids:
                  type: array
                  items:
                    type: string
                  description: List of run IDs to delete
                  example: ["abc123", "def456"]
                suite_hashes:
                  type: array
                  maxItems: 200
                  items:
                    type: string
                  description: Queue every run of these suites
                  example: ["22c2404b9ce3f47c"]
      responses:
        "202":
          description: Runs queued for deletion (may include partial errors)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  queued:
                    type: integer
                    description: Number of runs queued for deletion
                    example: 2
                  errors:
                    type: array
                    items:
                      type: string
                    description: Per-run error messages (omitted when empty)
                    example: []
        "400":
          description: Invalid request body or empty run_ids
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Storage backend does not support deletion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/runs/delete/cancel:
    post:
      operationId: cancelDeleteRuns
      tags: [admin]
      summary: Take runs out of the deletion queue
      description: |
        Clears the deletion mark (and any recorded error) on the given runs so the
        worker skips them. This is best-effort: a run the worker is deleting at this
        moment is still removed. A run that is not queued counts as cancelled.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [run_ids]
              properties:
                run_ids:
                  type: array
                  items:
                    type: string
                  description: List of run IDs to take out of the queue
      responses:
        "200":
          description: Cancel operation completed (may include partial errors)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  cancelled:
                    type: integer
                    description: Number of runs taken out of the queue
                  errors:
                    type: array
                    items:
                      type: string
                    description: Per-run error messages (omitted when empty)
        "400":
          description: Invalid request body or empty run_ids
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/runs/deletion-queue:
    get:
      operationId: listDeletionQueue
      tags: [admin]
      summary: List runs queued for deletion
      description: |
        Returns every run that is queued for deletion, in the order the worker
        will delete them. A run with a non-empty `error` failed its last attempt
        and will be retried.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Queued runs in deletion order
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [run_id, discovery_path, requested_at]
                  properties:
                    run_id:
                      type: string
                    discovery_path:
                      type: string
                    requested_at:
                      type: string
                      format: date-time
                      description: When the run was queued
                    error:
                      type: string
                      description: Last deletion error (omitted when empty)
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

# ── Components ──────────────────────────────────────────────────────
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: benchmarkoor_session
    bearerAuth:
      type: http
      scheme: bearer
      description: API key prefixed with `bmk_`

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    StatusOk:
      type: object
      properties:
        status:
          type: string
          example: ok

    # ── Database report schemas ─────────────────────────────────────

    DatabaseTableStat:
      type: object
      required: [name, rows]
      properties:
        name:
          type: string
          example: test_stats
        rows:
          type: integer
          format: int64

    DatabaseSuiteUsage:
      type: object
      description: |
        How much of the database one suite accounts for. Deleting a suite's
        runs cascades to its test stats and block logs, so these are the rows
        a cleanup actually frees.
      required: [suite_hash, runs, test_stats, block_logs]
      properties:
        suite_hash:
          type: string
        name:
          type: string
        discovery_path:
          type: string
        runs:
          type: integer
          format: int64
        test_stats:
          type: integer
          format: int64
        block_logs:
          type: integer
          format: int64
        last_run:
          type: integer
          format: int64
          description: Unix seconds of the newest run.

    DatabaseStats:
      type: object
      required: [driver, tables, top_suites]
      properties:
        driver:
          type: string
          example: sqlite
        path:
          type: string
          description: The SQLite file. Absent for other drivers.
        file_bytes:
          type: integer
          format: int64
        wal_bytes:
          type: integer
          format: int64
          description: The write-ahead log, which a long writer can leave large.
        page_size:
          type: integer
          format: int64
        page_count:
          type: integer
          format: int64
        free_pages:
          type: integer
          format: int64
          description: Pages a VACUUM would hand back.
        volume_total_bytes:
          type: integer
          format: int64
        volume_used_bytes:
          type: integer
          format: int64
          description: |
            What files occupy. This plus `volume_free_bytes` is less than
            `volume_total_bytes`, because a filesystem reserves a slice for
            root. A usage share is used/(used+free), the way df computes it.
        volume_free_bytes:
          type: integer
          format: int64
          description: |
            What is still available to a non-root process. The number that
            decides whether a cleanup is urgent.
        oldest_run:
          type: integer
          format: int64
        newest_run:
          type: integer
          format: int64
        tables:
          type: array
          items:
            $ref: "#/components/schemas/DatabaseTableStat"
        top_suites:
          type: array
          items:
            $ref: "#/components/schemas/DatabaseSuiteUsage"

    DatabaseStatsResponse:
      type: object
      required: [gathered_at, stats]
      properties:
        gathered_at:
          type: string
          format: date-time
          description: When the figures were taken. They are cached for a minute.
        stats:
          $ref: "#/components/schemas/DatabaseStats"

    # ── Indexer pass schemas ────────────────────────────────────────

    IndexerPass:
      type: object
      required: [started_at, finished_at, duration_ms, trigger, status]
      properties:
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        duration_ms:
          type: integer
          format: int64
          description: How long the pass took, in milliseconds.
        trigger:
          type: string
          enum: [startup, schedule, manual]
          description: What started the pass.
        status:
          type: string
          enum: [completed, cancelled]
          description: |
            How the pass ended. A shutdown cut a cancelled pass short, either
            between two discovery paths or inside one, so its counters cover
            only the work it got through. Runs whose reads the shutdown
            cancelled are not counted in `runs_failed`: the shutdown is not
            the run's fault.
        discovery_paths:
          type: integer
          description: How many discovery paths the pass walked.
        storage_runs:
          type: integer
          description: How many run directories storage held.
        indexed_runs:
          type: integer
          description: |
            How many of those the index already had. The gap to storage_runs
            is the backlog the pass started with.
        runs_indexed:
          type: integer
          description: Runs the pass added to the index.
        runs_reindexed:
          type: integer
          description: Incomplete runs the pass read again.
        runs_failed:
          type: integer
          description: Runs the pass could not index at all.
        skipped_failures:
          type: integer
          description: |
            Runs the pass never read, because their failure record is still
            inside the retry interval.
        error:
          type: string
          description: The last discovery path failure of the pass, if any.

    RunningIndexerPass:
      type: object
      required: [started_at, trigger, elapsed_ms]
      properties:
        started_at:
          type: string
          format: date-time
          description: When the running pass started.
        trigger:
          type: string
          enum: [startup, schedule, manual]
        elapsed_ms:
          type: integer
          format: int64
          description: |
            How long the pass had been running when this response was built.
            Measured on the server, so a client with a skewed clock still
            shows the right elapsed time.

    IndexerStatsResponse:
      type: object
      required: [running, limit, passes]
      properties:
        running:
          type: boolean
          description: |
            Whether a pass is in flight right now. Starting another while it
            is would only be refused with 409, so the UI waits instead.
        current_pass:
          allOf:
            - $ref: "#/components/schemas/RunningIndexerPass"
          description: |
            The pass in flight. Absent when none is running. A pass only
            writes its history row when it ends, so until then this is the
            only place it appears.
        interval:
          type: string
          description: The configured delay between passes, as a Go duration.
          example: 5m0s
        limit:
          type: integer
        passes:
          type: array
          description: The most recent passes, newest first.
          items:
            $ref: "#/components/schemas/IndexerPass"

    # ── Indexer housekeeping schemas ────────────────────────────────

    IndexerFailure:
      type: object
      required: [run_id, discovery_path, attempts]
      properties:
        run_id:
          type: string
          example: 1790344061_c0f24cc0_reth-bal-full
        discovery_path:
          type: string
          example: repricings/results
        run_timestamp:
          type: integer
          format: int64
          description: |
            Unix seconds taken from the run ID, which is named
            `{timestamp}_{shortID}_{instance}`. The run has no config.json,
            so the ID is the only place a timestamp survives. Absent when
            the ID does not follow the convention.
        error:
          type: string
          description: The failure of the most recent attempt.
          example: config.json not found
        attempts:
          type: integer
          description: How many indexing attempts have failed.
        first_failed_at:
          type: string
          format: date-time
        last_attempt_at:
          type: string
          format: date-time
        deletion_requested_at:
          type: string
          format: date-time
          description: Present while the run sits in the deletion queue.
        deletion_error:
          type: string
          description: The last failed deletion attempt. The run stays queued.

    IndexerFailuresResponse:
      type: object
      required: [total, limit, offset, entries]
      properties:
        total:
          type: integer
          format: int64
          description: Recorded failures in total, not just on this page.
        limit:
          type: integer
        offset:
          type: integer
        entries:
          type: array
          items:
            $ref: "#/components/schemas/IndexerFailure"

    IndexerFailuresActionRequest:
      type: object
      description: Give either run_ids or all.
      properties:
        run_ids:
          type: array
          items:
            type: string
        all:
          type: boolean
          description: Act on every recorded failure.

    # ── Auth schemas ────────────────────────────────────────────────
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserResponse"

    UserResponse:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          type: string
          enum: [admin, readonly]
        source:
          type: string
          enum: [config, admin, github]

    CreateAPIKeyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        expires_at:
          type: string
          format: date-time
          nullable: true

    CreateAPIKeyResponse:
      type: object
      properties:
        key:
          type: string
          description: "Full API key (only returned on creation): bmk_<64-hex-chars>"
        api_key:
          $ref: "#/components/schemas/APIKeyResponse"

    APIKeyResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        key_prefix:
          type: string
          description: First 8 hex characters of the key for display
        user_id:
          type: integer
        expires_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    AdminAPIKeyResponse:
      allOf:
        - $ref: "#/components/schemas/APIKeyResponse"
        - type: object
          properties:
            username:
              type: string

    SessionResponse:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        username:
          type: string
        source:
          type: string
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
