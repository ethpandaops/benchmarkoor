    post:
      operationId: upsertUserMapping
      tags: [admin]
      summary: Create or update a user role mapping
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserMappingRequest"
      responses:
        "200":
          description: Mapping created or updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMapping"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/github/user-mappings/{id}:
    delete:
      operationId: deleteUserMapping
      tags: [admin]
      summary: Delete a user role mapping
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Mapping deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOk"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Mapping not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/indexer/run:
    post:
      operationId: runIndexer
      tags: [admin]
      summary: Trigger an immediate indexing pass
      description: Starts an indexing pass. Returns 409 if one is already in progress.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "202":
          description: Indexing started
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: started
                  message:
                    type: string
                    example: Indexing pass started
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Indexing already in progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: already_running
                  message:
                    type: string
                    example: Indexing pass already in progress

  /admin/indexer/failures:
    get:
      operationId: listIndexerFailures
      tags: [admin]
      summary: List runs the indexer could not index
      description: |
        Returns runs that storage exposes but the indexer cannot index,
        usually because the run directory never got its `config.json`.

        A run is only recorded once it is older than the indexer's failure
        grace period, so a run still uploading never appears here. A recorded
        run is skipped by later passes until the retry interval lapses, and
        its record disappears on its own if the run later indexes or leaves
        storage.

        Newest run first. A neglected deployment holds thousands of these, so
        the listing is paged.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 200
            minimum: 1
            maximum: 1000
          description: Page size. Out-of-range values are clamped.
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: Recorded index failures
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexerFailuresResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/indexer/failures/delete:
    post:
      operationId: deleteIndexerFailures
      tags: [admin]
      summary: Queue failed runs so their stored data is deleted
      description: |
        Queues the stored data of failed runs for deletion. The request
        returns as soon as every record is marked; a background worker does
        the storage deletes in queue order and drops each record once its
        data is gone.

        Pass either `run_ids` or `all`. A run whose delete fails keeps its
        place in the queue with the reason on its record, and is retried.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndexerFailuresActionRequest"
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  queued:
                    type: integer
                  errors:
                    type: array
                    items:
                      type: string
        "400":
          description: Neither run_ids nor all was given
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Storage backend does not support deletion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/indexer/failures/delete/cancel:
    post:
      operationId: cancelDeleteIndexerFailures
      tags: [admin]
      summary: Take failed runs out of the deletion queue
      description: |
        Best-effort: a record the worker is deleting at this moment is still
        removed from the queue. A record that is not queued counts as
        cancelled. Pass either `run_ids` or `all`.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndexerFailuresActionRequest"
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  cancelled:
                    type: integer
                  errors:
                    type: array
                    items:
                      type: string
        "400":
          description: Neither run_ids nor all was given
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/runs/delete:
    post:
      operationId: deleteRuns
      tags: [admin]
      summary: Queue runs for deletion
      description: |
        Queues one or more runs for deletion. The request returns as soon as every
        run is marked. A background worker then deletes the runs one at a time, in
        the order they were queued: first from storage (S3/local), then from all
        related index tables (test_stats, block_logs, runs).

        While a run sits in the queue it stays visible in `GET /index` with
        `deletion_requested_at` set. A run that fails to delete keeps its place in
        the queue, carries the error in `deletion_error`, and is retried. The queue
        is persisted in the index database, so it survives a restart.

        Queuing a run that is already queued is a no-op. A run whose status is
        `running` is refused, because deleting it would race with the active
        runner. Partial success is possible — the response includes a count of
        queued runs and any per-run errors.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [run_ids]
              properties:
                run_ids:
                  type: array
                  items:
                    type: string
                  description: List of run IDs to delete
                  example: ["abc123", "def456"]
      responses:
        "202":
          description: Runs queued for deletion (may include partial errors)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  queued:
                    type: integer
                    description: Number of runs queued for deletion
                    example: 2
                  errors:
                    type: array
                    items:
                      type: string
                    description: Per-run error messages (omitted when empty)
                    example: []
        "400":
          description: Invalid request body or empty run_ids
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Storage backend does not support deletion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/runs/delete/cancel:
    post:
      operationId: cancelDeleteRuns
      tags: [admin]
      summary: Take runs out of the deletion queue
      description: |
        Clears the deletion mark (and any recorded error) on the given runs so the
        worker skips them. This is best-effort: a run the worker is deleting at this
        moment is still removed. A run that is not queued counts as cancelled.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [run_ids]
              properties:
                run_ids:
                  type: array
                  items:
                    type: string
                  description: List of run IDs to take out of the queue
      responses:
        "200":
          description: Cancel operation completed (may include partial errors)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  cancelled:
                    type: integer
                    description: Number of runs taken out of the queue
                  errors:
                    type: array
                    items:
                      type: string
                    description: Per-run error messages (omitted when empty)
        "400":
          description: Invalid request body or empty run_ids
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/runs/deletion-queue:
    get:
      operationId: listDeletionQueue
      tags: [admin]
      summary: List runs queued for deletion
      description: |
        Returns every run that is queued for deletion, in the order the worker
        will delete them. A run with a non-empty `error` failed its last attempt
        and will be retried.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Queued runs in deletion order
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [run_id, discovery_path, requested_at]
                  properties:
                    run_id:
                      type: string
                    discovery_path:
                      type: string
                    requested_at:
                      type: string
                      format: date-time
                      description: When the run was queued
                    error:
                      type: string
                      description: Last deletion error (omitted when empty)
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

# ── Components ──────────────────────────────────────────────────────
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: benchmarkoor_session
    bearerAuth:
      type: http
      scheme: bearer
      description: API key prefixed with `bmk_`

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    StatusOk:
      type: object
      properties:
        status:
          type: string
          example: ok

    # ── Indexer housekeeping schemas ────────────────────────────────

    IndexerFailure:
      type: object
      required: [run_id, discovery_path, attempts]
      properties:
        run_id:
          type: string
          example: 1790344061_c0f24cc0_reth-bal-full
        discovery_path:
          type: string
          example: repricings/results
        run_timestamp:
          type: integer
          format: int64
          description: |
            Unix seconds taken from the run ID, which is named
            `{timestamp}_{shortID}_{instance}`. The run has no config.json,
            so the ID is the only place a timestamp survives. Absent when
            the ID does not follow the convention.
        error:
          type: string
          description: The failure of the most recent attempt.
          example: config.json not found
        attempts:
          type: integer
          description: How many indexing attempts have failed.
        first_failed_at:
          type: string
          format: date-time
        last_attempt_at:
          type: string
          format: date-time
        deletion_requested_at:
          type: string
          format: date-time
          description: Present while the run sits in the deletion queue.
        deletion_error:
          type: string
          description: The last failed deletion attempt. The run stays queued.

    IndexerFailuresResponse:
      type: object
      required: [total, limit, offset, entries]
      properties:
        total:
          type: integer
          format: int64
          description: Recorded failures in total, not just on this page.
        limit:
          type: integer
        offset:
          type: integer
        entries:
          type: array
          items:
            $ref: "#/components/schemas/IndexerFailure"

    IndexerFailuresActionRequest:
      type: object
      description: Give either run_ids or all.
      properties:
        run_ids:
          type: array
          items:
            type: string
        all:
          type: boolean
          description: Act on every recorded failure.

    # ── Auth schemas ────────────────────────────────────────────────
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserResponse"

    UserResponse:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          type: string
          enum: [admin, readonly]
        source:
          type: string
          enum: [config, admin, github]

    CreateAPIKeyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        expires_at:
          type: string
          format: date-time
          nullable: true

    CreateAPIKeyResponse:
      type: object
      properties:
        key:
          type: string
          description: "Full API key (only returned on creation): bmk_<64-hex-chars>"
        api_key:
          $ref: "#/components/schemas/APIKeyResponse"

    APIKeyResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        key_prefix:
          type: string
          description: First 8 hex characters of the key for display
        user_id:
          type: integer
        expires_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    AdminAPIKeyResponse:
      allOf:
        - $ref: "#/components/schemas/APIKeyResponse"
        - type: object
          properties:
            username:
              type: string

    SessionResponse:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        username:
          type: string
        source:
          type: string
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        last_active_at:
          type: string
          format: date-time
          nullable: true

    # ── Admin schemas ───────────────────────────────────────────────
    CreateUserRequest:
      type: object
      required: [username, password, role]
      properties:
        username:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [admin, readonly]

    UpdateUserRequest:
      type: object
      properties:
        password:
          type: string
        role:
          type: string
          enum: [admin, readonly]

    OrgMapping:
      type: object
      properties:
        id:
          type: integer
        org:
          type: string
        role:
          type: string
          enum: [admin, readonly]

    OrgMappingRequest:
      type: object
      required: [org, role]
      properties:
        org:
          type: string
        role:
          type: string
          enum: [admin, readonly]

    UserMapping:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          type: string
          enum: [admin, readonly]

    UserMappingRequest:
      type: object
      required: [username, role]
      properties:
        username:
          type: string
        role:
          type: string
          enum: [admin, readonly]

    # ── Config schema ───────────────────────────────────────────────
    ConfigResponse:
      type: object
      properties:
        auth:
          type: object
          properties:
            basic_enabled:
              type: boolean
            github_enabled:
              type: boolean
            anonymous_read:
              type: boolean
        storage:
          type: object
          properties:
            s3:
              type: object
              properties:
                enabled:
                  type: boolean
                discovery_paths:
                  type: array
                  items:
                    type: string
            local:
              type: object
              properties:
                enabled:
                  type: boolean
                discovery_paths:
                  type: array
                  items:
                    type: string
        indexing:
          type: object
          properties:
            enabled:
              type: boolean

    # ── Index schemas ───────────────────────────────────────────────
    IndexResponse:
      type: object
      properties:
        generated:
          type: integer
          format: int64
          description: Unix timestamp of when the index was generated
        entries:
          type: array
          items:
            $ref: "#/components/schemas/IndexEntry"

    IndexEntry:
      type: object
      properties:
        discovery_path:
          type: string
        run_id:
          type: string
        timestamp:
          type: integer
          format: int64
        timestamp_end:
          type: integer
          format: int64
        suite_hash:
          type: string
        status:
          type: string
        termination_reason:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Run metadata labels (key-value pairs)
        deletion_requested_at:
          type: integer
          format: int64
          description: |
            Unix timestamp (seconds) of when the run was queued for deletion.
            Omitted when the run is not queued.
        deletion_error:
          type: string
          description: Last deletion error for a queued run (omitted when empty)
        instance:
          type: object
          properties:
            id:
              type: string
            client:
              type: string
            image:
              type: string
            rollback_strategy:
              type: string
        tests:
          type: object
          properties:
            tests_total:
              type: integer
            tests_passed:
              type: integer
            tests_failed:
              type: integer
            steps:
              type: object
              properties:
                setup:
                  $ref: "#/components/schemas/StepStats"
                test:
                  $ref: "#/components/schemas/StepStats"
                cleanup:
                  $ref: "#/components/schemas/StepStats"

    StepStats:
      type: object
      properties:
        success:
          type: integer
        fail:
          type: integer
        duration:
          type: integer
          format: int64
        gas_used:
          type: integer
          format: uint64
        gas_used_duration:
          type: integer
          format: int64
        resource_totals:
          $ref: "#/components/schemas/ResourceTotals"

    ResourceTotals:
      type: object
      properties:
        cpu_usec:
          type: integer
          format: uint64
        memory_bytes:
          type: integer
          format: uint64
        memory_delta:
          type: integer
          format: int64
        disk_read_bytes:
          type: integer
          format: uint64
        disk_write_bytes:
          type: integer
          format: uint64
        disk_read_iops:
          type: integer
          format: uint64
        disk_write_iops:
          type: integer
          format: uint64

    SuiteStatsResponse:
      type: object
      additionalProperties:
        type: object
        properties:
          durations:
            type: array
            items:
              $ref: "#/components/schemas/RunDuration"

    RunDuration:
      type: object
      properties:
        id:
          type: string
        client:
          type: string
        gas_used:
          type: integer
          format: uint64
        time_ns:
          type: integer
          format: int64
        run_start:
          type: integer
          format: int64
        run_end:
          type: integer
          format: int64
        steps:
          type: object
          properties:
            setup:
              $ref: "#/components/schemas/StepDuration"
            test:
              $ref: "#/components/schemas/StepDuration"
            cleanup:
              $ref: "#/components/schemas/StepDuration"

    StepDuration:
      type: object
      properties:
        gas_used:
          type: integer
          format: uint64
        time_ns:
          type: integer
          format: int64

    # ── Query schemas ───────────────────────────────────────────────
    QueryResultRuns:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/RunResponse"
        total:
          type: integer
          format: int64
        limit:
          type: integer
        offset:
          type: integer

    RunResponse:
      type: object
      properties:
        id:
          type: integer
        discovery_path:
          type: string
        run_id:
          type: string
        timestamp:
          type: integer
          format: int64
        timestamp_end:
          type: integer
          format: int64
        suite_hash:
          type: string
        status:
          type: string
        termination_reason:
          type: string
        has_result:
          type: boolean
        instance_id:
          type: string
        client:
          type: string
        image:
          type: string
        rollback_strategy:
          type: string
        tests_total:
          type: integer
        tests_passed:
          type: integer
        tests_failed:
          type: integer
        steps_json:
          type: object
          description: Raw step statistics JSON
        indexed_at:
          type: string
          format: date-time
        reindexed_at:
          type: string
          format: date-time
          nullable: true
        deletion_requested_at:
          type: string
          format: date-time
          nullable: true
          description: Set while the run is queued for deletion
        deletion_error:
          type: string
          description: Last deletion error for a queued run (omitted when empty)

    QueryResultTestStats:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TestStatResponse"
        total:
          type: integer
          format: int64
        limit:
          type: integer
        offset:
          type: integer

    QueryResultTestStatsBlockLogs:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TestStatsBlockLogResponse"
        total:
          type: integer
          format: int64
        limit:
          type: integer
        offset:
          type: integer

    TestStatResponse:
      type: object
      properties:
        id:
          type: integer
        suite_hash:
          type: string
        test_name:
          type: string
        run_id:
          type: string
        client:
          type: string
        total_gas_used:
          type: integer
          format: uint64
        total_time_ns:
          type: integer
          format: int64
        total_mgas_s:
          type: number
          format: double
        setup_gas_used:
          type: integer
          format: uint64
        setup_time_ns:
          type: integer
          format: int64
        setup_mgas_s:
          type: number
          format: double
        test_gas_used:
          type: integer
          format: uint64
        test_time_ns:
          type: integer
          format: int64
        test_mgas_s:
          type: number
          format: double
        run_start:
          type: integer
          format: int64
        run_end:
          type: integer
          format: int64

    TestStatsBlockLogResponse:
      type: object
      properties:
        id:
          type: integer
        suite_hash:
          type: string
        run_id:
          type: string
        test_name:
          type: string
