<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Benchmarkoor</title>
    <script>
      (function() {
        const theme = localStorage.getItem('theme')
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
        // The URL param wins over the saved preference (see hooks/useLayoutWidth.ts).
        const urlLayout = new URLSearchParams(window.location.search).get('layout')
        const layout = (urlLayout === 'wide' || urlLayout === 'contained')
          ? urlLayout
          : localStorage.getItem('benchmarkoor:layout-width')
        if (layout === 'wide') {
          document.documentElement.classList.add('wide')
        }
      })()
    </script>
  </head>
  <body class="bg-gray-50 dark:bg-gray-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
