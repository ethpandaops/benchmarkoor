# Building data directories and EEST FULL STATEFUL (bloatnet / repricing) payloads —
# AMSTERDAM fill on glamsterdam-devnet-8.
#
# This is the "full" counterpart of config.state-actor-eest.simple.amsterdam.stateful.yaml:
# the large repricing prestate that backs the tests/benchmark/stateful/bloatnet
# benchmarks. The prestate, EEST branch and client builds are those of
# ethpandaops/benchmarkoor-tests state-actor/v2 (configs/datadirs/state-actor/v2
# and configs/contexts/repricing/state-actor/v2/glamsterdam-devnet-8). Each
# client's snapshot is ~520-720 GB on disk.
#
# ── Run this in a Linux env with a COW datadir method (overlayfs/zfs/schelk) ──
# macOS has none of these, and `copy` is infeasible at this size (copied per fill
# and per client per run). Provision an OrbStack Linux machine with
# .hack/orbstack.sh (dedicated dockerd + overlayfs + a native benchmarkoor build),
# then run as root INSIDE the machine (overlayfs mount needs CAP_SYS_ADMIN):
#
#   .hack/orbstack.sh bench
#   orb -m bench sudo benchmarkoor build --config $(pwd)/examples/configuration/config.state-actor-eest.full.amsterdam.stateful.yaml --force
#   orb -m bench sudo benchmarkoor run   --config $(pwd)/examples/configuration/config.state-actor-eest.full.amsterdam.stateful.yaml --limit-instance-id=geth
#
# Amsterdam is activated exactly as in the other configs: geth/erigon via the
# --override.amsterdam flag, besu/reth/ethrex/nimbus via genesis_fork_override,
# nethermind via genesis_eip_override.
#
# nimbus is commented out below: its state-actor build has only been tested on
# small snapshots (see the simple configs). Enable it to try it at this size.
#
global:
  log_level: info
  env:
    # Per-config dirs so configs that build different state-actor snapshots or
    # EEST fixtures don't collide under /tmp. Override by exporting these. Each
    # client writes under its own <prefix>/<client> subdir.
    STATE_DIR: /tmp/benchmarkoor/state-actor/full-amsterdam-stateful
    EEST_FIXTURES_DIR: /tmp/benchmarkoor/eest-fixtures/full-amsterdam-stateful
    EEST_FIXTURES_RUNNER_SOURCE: geth   # which filler's fixtures the runner replays
    AMSTERDAM_ACTIVATION_TS: "1"

builder:
  ## Stage 1: Building the large repricing datadir using state-actor
  state_actor:
    # f171c26 is the merge of ethereum/state-actor#153, which makes the
    # code_pattern runtimes on demand. Before #153, state-actor kept all of
    # them in memory (~19 GiB for this spec), and the nethermind, reth and
    # besu builds were OOM-killed on 61 GB hosts. Do not go back before it.
    images:
      geth: ghcr.io/ethereum/state-actor:main-f171c26
      nethermind: ghcr.io/ethereum/state-actor-nethermind:main-f171c26
      ethrex: ghcr.io/ethereum/state-actor-ethrex:main-f171c26
      reth: ghcr.io/ethereum/state-actor-reth:main-f171c26
      besu: ghcr.io/ethereum/state-actor-besu:main-f171c26
      erigon: ghcr.io/ethereum/state-actor-erigon:main-f171c26
      # nimbus: ghcr.io/ethereum/state-actor-nimbus:main-6dd2e8f
    pull_policy: always
    config:
      seed: 42
      fork: osaka
      chain: 1337
      # 1 TGas. geth adds the gas limit of each transaction to the block
      # total, so at 1 GGas the setup blocks fail with "gas limit reached".
      gas_limit: 1000000000000
      target_size: 350GB
    spec:
      entities:
        # Pre-funded seed for fill-stateful — Hardhat/Anvil dev key #0
        # (pkey 0xac0974…ff80). Pinned below via rpc_seed_key.
        - kind: eoa
          name: fill-stateful-seed
          address: 0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266
          balance: "0x33b2e3c91efc989409c0000"
        # Sequential EOAs at 0x1000+ (test_account_access EXISTING_EOA).
        - kind: contract
          name: sequential-eoas-300m
          template: sequential_eoas
          address: 0x0000000000000000000000000000000000001000
          parameters:
            count: 150000
            balance: "1000000000000000000"
        # 10GB storage-pattern target at the bloated_eoa_10GB stub address
        # (test_sload_bloated / test_sstore_bloated, existing_slots=True). ~73 GB.
        - kind: contract
          name: storage-pattern-10gb
          template: storage_pattern
          address: 0x87a6314da5ac8832f6e7a176c8fb133b19f5be04
          nonce: 1
          balance: "1000000000000000000"
          parameters:
            final: 335545082
        # Arachnid CREATE2 factory (required by create2_deploys + EEST fill).
        - kind: contract
          name: create2-factory
          template: create2_factory
          address: 0x4e59b44847b379578588920cA78FbF26c0B4956C
        # CREATE2 receivers, one entity per AccountMode initcode and code size.
        #
        # 24 KiB (Osaka max code size). These are the v1 entities, so the
        # receivers keep their v1 addresses. The minimal
        # initcode 0x60016000f3 (PUSH1 1, PUSH1 0, RETURN) deploys the 1-byte
        # STOP runtime — byte-identical to EEST's MinimalContractInitcode. It
        # has no code size, so the 64 KiB block below has no minimal entity.
        - kind: contract
          name: create2-minimal-300m
          template: create2_deploys
          parameters:
            initcode: "0x60016000f3"
            runtime: "0x00"
            salt_count: 150000 # 150K
        - kind: contract
          name: create2-same-300m
          template: create2_deploys
          parameters:
            code_pattern: max_same_pre_amsterdam
            salt_count: 150000 # 150K
        - kind: contract
          name: create2-diff-300m
          template: create2_deploys
          parameters:
            code_pattern: max_diff_pre_amsterdam
            salt_count: 150000 # 150K
        - kind: contract
          name: create2-jumpdest-300m
          template: create2_deploys
          parameters:
            code_pattern: unique_jumpdest_pre_amsterdam
            salt_count: 150000 # 150K
        # 64 KiB (Amsterdam max code size, EIP-7954). code_size makes
        # state-actor build the same initcode as EEST's
        # StopJumpdestInitcode / JochemnetPredeployContractInitcode at
        # code_size=65536, so the CREATE2 addresses agree. 100K salts, the
        # same count as the jochemnet pre-run (BLOATNET_RECEIVER_CONTRACT_COUNT)
        # that filled the devnet-8 suites at 300M. Each unique runtime stays
        # in memory during the build: 100K x 64 KiB ≈ 6.1 GiB for each of
        # diff and jumpdest.
        - kind: contract
          name: create2-same-64kib
          template: create2_deploys
          parameters:
            code_pattern: max_same
            code_size: 65536
            salt_count: 100000 # 100K
        - kind: contract
          name: create2-diff-64kib
          template: create2_deploys
          parameters:
            code_pattern: max_diff
            code_size: 65536
            salt_count: 100000 # 100K
        - kind: contract
          name: create2-jumpdest-64kib
          template: create2_deploys
          parameters:
            code_pattern: unique_jumpdest
            code_size: 65536
            salt_count: 100000 # 100K
        # Sender pool for test_ether_transfers_onchain_receivers, which derives
        # senders as EOA(key=SENDER_BASE_KEY + i) and assumes them pre-funded.
        # SENDER_BASE_KEY = keccak256("gas-repricings-private-key") on this EEST
        # branch (NOT the gist's 0x1111…, which left every sender unfunded); the
        # first sender is 0x4e5e4cbb…377a. 150000 funded.
        - kind: contract
          name: sender-pool-300m
          template: sequential_pkey_eoas
          parameters:
            start_pkey: "0xe1e1d3457c4e69b29cba0f7e1f92ce080d4db56d221bed913b09b2753bd97c7a"
            count: 150000
            balance: "1000000000000000000"
        # Bittrex CREATE-preimage chain (test_account_access EXISTING_CONTRACT).
        - kind: contract
          name: bittrex-create-preimage-300m
          template: create_preimage_deploys
          parameters:
            sender: "0xA3C1E324CA1CE40DB73ED6026C4A177F099B5770"
            start_nonce: 2
            count: 150000
            runtime: ""
            storage_init:
              "0x0": "0xa3c1e324ca1ce40db73ed6026c4a177f099b5770"
        # EIP-7702 delegations: authority i delegates to the max_diff receiver i
        # (EXISTING_CONTRACT_DIFF_MAX) of the same code size. An authority can
        # carry only one delegation, so each code size has its own key range:
        #   start_pkey = keccak256("gas-repricings-7702-delegate" ++ uint256(code_size))
        # (execution-specs delegate_base_key). v1's single range,
        # keccak256("gas-repricings-7702-delegate") = 0x959a…c64e, is not read
        # by these benchmarks and is left out.
        - kind: contract
          name: delegations-24kib
          template: sequential_pkey_delegations
          parameters:
            start_pkey: "0x12bfac886c352268c54211c3b5613fef58d4e559fd0891c0ca534e47efed694e"
            code_pattern: max_diff_pre_amsterdam
            count: 150000 # 150K, paired with create2-diff-300m
            balance: "1000000000000000000"
        - kind: contract
          name: delegations-64kib
          template: sequential_pkey_delegations
          parameters:
            start_pkey: "0x839457a98a77bfdf20fcb7ada1fed618bec69a4dc46d6811f60f2e4d41b59206"
            code_pattern: max_diff
            code_size: 65536
            count: 100000 # 100K, paired with create2-diff-64kib
            balance: "1000000000000000000"
        # EIP-8282 builder-execution-request predeploys (system-called at end of
        # every block since amsterdam). devnet-8 clients reject every block if
        # these have no code; predeploy the bytecode so the end-of-block system
        # call returns empty requests (queue empty).
        - kind: contract
          name: eip8282-builder-deposit-requests
          address: 0x0000bff46984e3725691fa540a8c7589300d8282
          nonce: 1
          code: ""
        - kind: contract
          name: eip8282-builder-exit-requests
          address: 0x000064d678505ad48f8ccb093bc65613800e8282
          nonce: 1
          code: ""

    targets:
      - client: geth
        output_dir: ${STATE_DIR}/geth          # ~554 GB
      - client: nethermind
        output_dir: ${STATE_DIR}/nethermind    # ~520 GB
      - client: ethrex
        output_dir: ${STATE_DIR}/ethrex        # ~720 GB
      - client: reth
        output_dir: ${STATE_DIR}/reth          # ~588 GB
      - client: besu
        output_dir: ${STATE_DIR}/besu          # ~534 GB
      - client: erigon
        output_dir: ${STATE_DIR}/erigon        # ~517 GB
      # - client: nimbus
      #   output_dir: ${STATE_DIR}/nimbus

  ## Stage 2: Building EEST bloatnet/repricing fixtures
  eest_payloads:
    # Fill image defaults to a Dockerfile embedded in the binary; set fill_image
    # to pull a pre-built one, or fill_dockerfile to build from a custom Dockerfile.
    pull_policy: always
    # The fill-stateful branch the devnet-8 benchmarks fill from.
    eest_repo: https://github.com/skylenet/execution-specs.git
    eest_ref: fix/genesis-head-slot-number
    config:
      fork: amsterdam
      # Hardhat/Anvil dev key #0 → 0xf39Fd6…2266 (the pre-funded seed above).
      rpc_seed_key: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
      # The prestate is sized for 300M gas; start lower for faster fills.
      gas_benchmark_values: [30]
      # COW is mandatory at this size — overlayfs (Linux/OrbStack). On the host
      # this would be `copy` (infeasible). See .hack/orbstack.sh.
      datadir_method: overlayfs
      # Both targets fill the SAME bloatnet set against the SAME prestate, so
      # tests / filter / address_stubs are hoisted here once instead of repeated
      # per target. Any target may still override an individual field.
      tests:
        - tests/benchmark/stateful/bloatnet
      # Resolves @pytest.mark.stub_parametrize prefixes against pre-deployed
      # state (e.g. bloated_eoa_10GB → 0x87a6…be04).
      address_stubs:
        bloated_eoa_10GB:
          addr: "0x87a6314da5ac8832f6e7a176c8fb133b19f5be04"
          pkey: "0x4da32d29f6dcffa26e09dc4e102033f2d105de1444fb893493ae703289275e0e"
      # test_deploy_existing_contracts is a pre-run setup, not a benchmark: it
      # deploys the receivers and delegations the prestate above already has,
      # so every CREATE2 deploy collides.
      filter: >-
        not test_deploy_existing_contracts
    targets:
      # Geth
      - name: payload-generator-geth-stateful-full
        filler_client: geth
        filler_image: ethpandaops/geth:glamsterdam-devnet-8
        source_dir: ${STATE_DIR}/geth
        output_dir: ${EEST_FIXTURES_DIR}/geth
        # geth boots from the snapshot datadir; activate amsterdam at block 0's
        # timestamp (0) + 1 via the override flag — same as the runner geth instance.
        filler_extra_args:
          - --override.amsterdam=${AMSTERDAM_ACTIVATION_TS}
          - --engine.maxreorgdepth=1024    # Long-chain benchmarks exceed the 512 default
          - --rpc.batch-request-limit=16384 # Default 1000
          - --rpc.http-body-limit=128       # Default 5 (megabytes)

      # Nethermind
      - name: payload-generator-nethermind-stateful-full
        filler_client: nethermind
        filler_image: ethpandaops/nethermind:glamsterdam-devnet-8
        source_dir: ${STATE_DIR}/nethermind
        # nethermind reads a parity chainspec; amsterdam is activated via the
        # genesis_eip_override (same EIP set as the runner instance).
        genesis: ${STATE_DIR}/nethermind/parity-chainspec.json
        genesis_eip_override:
          timestamp: ${AMSTERDAM_ACTIVATION_TS}
          eips: [2780, 7708, 7778, 7843, 7928, 7954, 7976, 7981, 7997, 8024, 8037, 8038, 8246, 8282]
        output_dir: ${EEST_FIXTURES_DIR}/nethermind
        filler_extra_args:
          - --FlatDb.Enabled=true
          - --FlatDb.CompactionOffset=0
          - --FlatDb.MinReorgDepth=1024
          - --FlatDb.MaxReorgDepth=1024
          - --JsonRpc.MaxBatchSize=16384 # Default 1024
          - --Init.AutoDump=None
          - --Merge.NewPayloadBlockProcessingTimeout=70000
          - --Blocks.CachePrecompilesOnBlockProcessing=false

## Stage 3: Run the bloatnet/repricing benchmarks
runner:
  client_logs_to_stdout: true
  cleanup_on_start: false
  directories:
    # Scratch dir for the overlayfs/copy datadir prep (default: system temp).
    # reth keeps state in one monolithic MDBX file that gets copied here, so on a
    # host where /tmp is a small tmpfs (e.g. the OrbStack VM) set TMP_DATADIR to a
    # real disk (e.g. /root/bench/tmp) or reth dies with "No space left on
    # device". RocksDB/Pebble clients (geth/nethermind/besu/ethrex) are fine on
    # the default.
    tmp_datadir: ${TMP_DATADIR:-}
  benchmark:
    results_dir: ./results
    generate_results_index: true
    generate_suite_stats: true
    tests:
      source:
        eest_fixtures:
          local_fixtures_dir: ${EEST_FIXTURES_DIR}/${EEST_FIXTURES_RUNNER_SOURCE}
          fixtures_subdir: blockchain_tests_stateful_engine
  client:
    config:
      rollback_strategy: container-recreate  # recreate the container and rollback snapshot datadir
      bootstrap_fcu:
        enabled: true
        max_retries: 10
        backoff: 1s
      # Per-client genesis/chainspec the runner boots each instance from. geth
      # needs none (it boots from the datadir + --override.amsterdam flag), so it
      # is omitted; nethermind reads a parity-format chainspec and gets amsterdam
      # via the per-instance genesis_eip_override below.
      genesis:
        nethermind: ${STATE_DIR}/nethermind/parity-chainspec.json
        ethrex: ${STATE_DIR}/ethrex/ethrex-genesis.json
        reth: ${STATE_DIR}/reth/chainspec.json
        besu: ${STATE_DIR}/besu/besu-chainspec.json
        erigon: ${STATE_DIR}/erigon/chainspec.json
        # nimbus: ${STATE_DIR}/nimbus/nimbus-genesis.json
    datadirs:
      geth:
        source_dir: ${STATE_DIR}/geth
        method: overlayfs
      nethermind:
        source_dir: ${STATE_DIR}/nethermind
        method: overlayfs
      ethrex:
        source_dir: ${STATE_DIR}/ethrex
        method: overlayfs
      # reth's overlay copies a monolithic MDBX file — on a tmpfs /tmp set
      # TMP_DATADIR to a real disk (see runner.directories.tmp_datadir above).
      reth:
        source_dir: ${STATE_DIR}/reth
        method: overlayfs
      besu:
        source_dir: ${STATE_DIR}/besu
        method: overlayfs
      erigon:
        source_dir: ${STATE_DIR}/erigon
        method: overlayfs
      # nimbus:
      #   source_dir: ${STATE_DIR}/nimbus
      #   method: overlayfs

  # The devnet-8 client builds, in BAL "full" mode. Each client needs its own
  # snapshot (state_actor target above) + the genesis/override wiring — see
  # config.state-actor-eest.simple.amsterdam.stateful.yaml for the notes.
  instances:
    - id: geth
      client: geth
      image: ethpandaops/geth:master
      extra_args:
        - --cache.noprecompile
        - --engine.maxreorgdepth=1024
        - --override.amsterdam=${AMSTERDAM_ACTIVATION_TS}
        - --debug.logslowblock=0
    - id: reth
      client: reth
      image: ethpandaops/reth:glamsterdam-devnet-8
      genesis_fork_override:
        amsterdam: ${AMSTERDAM_ACTIVATION_TS}
      extra_args: [--engine.slow-block-threshold=0]
      retry_new_payloads_failed_state: { enabled: true, max_retries: 10, backoff: 1s }
    - id: nethermind
      client: nethermind
      image: ethpandaops/nethermind:master
      genesis_eip_override:
        timestamp: ${AMSTERDAM_ACTIVATION_TS}
        eips: [2780, 7708, 7778, 7843, 7928, 7954, 7976, 7981, 7997, 8024, 8037, 8038, 8246, 8282]
      extra_args:
        - --Init.BaseDbPath=/data
        - --FlatDb.Enabled=true
        - --FlatDb.CompactionOffset=0
        - --FlatDb.MinReorgDepth=1024
        - --FlatDb.MaxReorgDepth=1024
        - --Blocks.ParallelExecution=true
        - --Blocks.ParallelExecutionBatchRead=true
      retry_new_payloads_syncing_state: { enabled: true, max_retries: 10, backoff: 2s }
    - id: besu
      client: besu
      image: ethpandaops/besu:main-cf89071
      genesis_fork_override:
        amsterdam: ${AMSTERDAM_ACTIVATION_TS}
      environment: { BESU_OPTS: "-Xms8g -Xmx8g -XX:+AlwaysPreTouch" }
      extra_args: [--Xplugin-rocksdb-high-spec-enabled=true, --Xbal-perfect-parallelization-enabled=true, --Xbal-state-root-enabled=true]
    - id: ethrex
      client: ethrex
      image: ethpandaops/ethrex:main
      genesis_fork_override:
        amsterdam: ${AMSTERDAM_ACTIVATION_TS}
      extra_args: [--skip-genesis-validation, --no-precompile-cache]
    - id: erigon
      client: erigon
      image: ethpandaops/erigon:main
      extra_args:
        - --debug.slow-block-threshold=0
        - --override.amsterdam=${AMSTERDAM_ACTIVATION_TS}
        - --exec.no-merge=true
        - --exec.no-prune=true
        - --exec.no-background-maintenance
        - --experimental.parallel-commitment
      bootstrap_fcu: { enabled: true, max_retries: 120, backoff: 30s }
      retry_new_payloads_syncing_state: { enabled: true, max_retries: 240, backoff: 30s }
    # - id: nimbus
    #   client: nimbus
    #   # state-actor writes nimbus's current Aristo format, which the
    #   # glamsterdam-devnet-8 image cannot read (DeblobWrongType).
    #   image: statusim/nimbus-eth1:master
    #   genesis_fork_override:
    #     amsterdam: ${AMSTERDAM_ACTIVATION_TS}
    #   extra_args: [--debug-rewrite-datadir-id]
